name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests, UI-test compile, and release checks
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebugAndroidTest lintRelease bundleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: android-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Create and boot an available simulator
        id: simulator
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -er '[.runtimes[] | select(.isAvailable == true and (.identifier | contains("iOS")))] | last | .identifier')
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | jq -er '[.devicetypes[] | select(.name | startswith("iPhone"))] | last | .identifier')
          UDID=$(xcrun simctl create "KeepSpace CI" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit and UI tests
        run: xcodebuild test -project SmartStorage.xcodeproj -scheme SmartStorage -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' CODE_SIGNING_ALLOWED=NO
