services:
  keepspace-web:
    image: 526905974500.dkr.ecr.ap-southeast-1.amazonaws.com/keepspace:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keepspace-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
