name: SmartStorage
options:
  bundleIdPrefix: com.keepspace
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SmartStorage:
    type: application
    platform: iOS
    sources: [SmartStorage]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keepspace.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KeepSpace
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPad must support every orientation to allow Split View / Stage Manager.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: KeepSpace analyzes your photos and videos entirely on this device to find space you can safely recover.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SmartStorageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmartStorageTests]
    dependencies:
      - target: SmartStorage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.keepspace.app.tests
schemes:
  SmartStorage:
    build:
      targets:
        SmartStorage: all
    test:
      targets: [SmartStorageTests]
