name: SmartStorage
options:
  bundleIdPrefix: com.keepspace
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    KEEP_SPACE_GOOGLE_CLIENT_ID: "704189605605-aaosn5etn4m6peil1dttaffdb0c20jtk.apps.googleusercontent.com"
    KEEP_SPACE_MICROSOFT_CLIENT_ID: "3f3a9ce1-efd8-4c61-bd72-5fcce0aa47f6"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  SmartStorage:
    type: application
    platform: iOS
    sources: [SmartStorage]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: SmartStorage/Resources/Info.plist
      properties:
        CFBundleDisplayName: KeepSpace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: KeepSpace needs access to analyze and back up the photos and videos you choose. AI analysis stays on this device; backups go directly to your selected Google Drive or OneDrive account.
        NSPhotoLibraryAddUsageDescription: KeepSpace saves a compressed copy only when you choose to compress a video. You review the result before removing the original.
        CFBundleURLTypes:
          - CFBundleURLName: com.keepspace.oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.704189605605-aaosn5etn4m6peil1dttaffdb0c20jtk
              - msauth.com.keepspace.app
        GIDClientID: $(KEEP_SPACE_GOOGLE_CLIENT_ID)
        KEEP_SPACE_GOOGLE_CLIENT_ID: $(KEEP_SPACE_GOOGLE_CLIENT_ID)
        KEEP_SPACE_MICROSOFT_CLIENT_ID: $(KEEP_SPACE_MICROSOFT_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keepspace.app
        DEVELOPMENT_TEAM: 82MGZU2HH4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SmartStorageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmartStorageTests]
    dependencies:
      - target: SmartStorage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.keepspace.app.tests
        DEVELOPMENT_TEAM: 82MGZU2HH4
        CODE_SIGN_STYLE: Automatic
  SmartStorageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SmartStorageUITests]
    dependencies:
      - target: SmartStorage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.keepspace.app.uitests
        DEVELOPMENT_TEAM: 82MGZU2HH4
        CODE_SIGN_STYLE: Automatic
schemes:
  SmartStorage:
    build:
      targets:
        SmartStorage: all
    run:
      storeKitConfiguration: StoreKit/KeepSpace.storekit
    test:
      targets: [SmartStorageTests, SmartStorageUITests]
